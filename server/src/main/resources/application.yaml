server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/audition_pocket}
    database: ${MONGODB_DATABASE:audition_pocket}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@auditionpocket.com}
    password: ${ADMIN_PASSWORD:}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}